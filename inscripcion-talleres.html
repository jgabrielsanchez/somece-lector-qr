<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscripción a Talleres - SOMECE 2026</title>
  <style>
    :root {
      --fondo:#F4F7F6;
      --superficie:#FFFFFF;
      --sidebar:#183D3D;
      --texto:#243434;
      --secundario:#647473;
      --borde:#DCE5E2;
      --principal:#397A73;
      --principal-hover:#306A64;
      --activo:#DCEDE9;
      --cancelar:#71807D;
      --exito-fondo:#E3F1E8;
      --exito-texto:#356448;
      --info-fondo:#E5EFF2;
      --info-texto:#3F626B;
      --error-fondo:#F5E7E5;
      --error-texto:#8A4D49;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      font-family:Arial,sans-serif;
      background:var(--fondo);
      color:var(--texto);
    }

    .contenedor {
      width:min(1120px, calc(100% - 32px));
      margin:28px auto 48px;
    }

    .encabezado {
      margin-bottom:18px;
    }

    .encabezado h1 {
      margin:0;
      color:var(--principal);
      font-size:30px;
    }

    .encabezado p {
      margin:5px 0 0;
      color:var(--secundario);
      font-size:18px;
    }

    .tarjeta {
      background:var(--superficie);
      border:1px solid var(--borde);
      border-radius:16px;
      padding:22px;
      margin-bottom:18px;
      box-shadow:0 8px 28px rgba(24,61,61,.06);
    }

    h2 {
      margin:0 0 16px;
      font-size:22px;
    }

    label {
      display:block;
      font-weight:700;
      margin-bottom:7px;
    }

    input[type="text"] {
      width:min(420px,100%);
      padding:10px 12px;
      border:1px solid var(--borde);
      border-radius:9px;
      font-size:16px;
      color:var(--texto);
      background:white;
    }

    .fila {
      display:flex;
      align-items:flex-end;
      gap:10px;
      flex-wrap:wrap;
    }

    button {
      width:auto;
      border:0;
      border-radius:8px;
      padding:8px 14px;
      font-size:15px;
      font-weight:600;
      cursor:pointer;
      transition:.15s ease;
    }

    button:disabled {
      opacity:.55;
      cursor:not-allowed;
    }

    .principal {
      background:var(--principal);
      color:white;
    }

    .principal:hover:not(:disabled) {
      background:var(--principal-hover);
    }

    .secundario {
      background:var(--cancelar);
      color:white;
    }

    .ponente-info {
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
      margin-bottom:18px;
    }

    .dato {
      background:var(--fondo);
      border:1px solid var(--borde);
      border-radius:10px;
      padding:12px;
    }

    .dato strong {
      display:block;
      margin-bottom:4px;
    }

    .barra-seleccion {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      margin:14px 0;
    }

    .contador {
      font-weight:700;
      color:var(--principal);
    }

    .talleres {
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:12px;
    }

    .taller {
      position:relative;
      border:1px solid var(--borde);
      border-radius:12px;
      padding:16px;
      background:white;
      cursor:pointer;
      transition:.15s ease;
    }

    .taller:hover {
      border-color:var(--principal);
      transform:translateY(-1px);
    }

    .taller.seleccionado {
      border:2px solid var(--principal);
      background:var(--activo);
    }

    .taller.bloqueado {
      cursor:default;
    }

    .taller input {
      position:absolute;
      top:14px;
      right:14px;
      width:18px;
      height:18px;
      accent-color:var(--principal);
    }

    .taller-nombre {
      display:block;
      padding-right:30px;
      font-size:17px;
      font-weight:700;
      line-height:1.3;
      margin-bottom:10px;
    }

    .taller-dato {
      color:var(--secundario);
      font-size:14px;
      margin-top:5px;
      line-height:1.35;
    }

    .acciones {
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:18px;
    }

    .mensaje {
      display:none;
      margin-top:14px;
      padding:12px 14px;
      border-radius:9px;
      line-height:1.4;
    }

    .mensaje.error {
      display:block;
      background:var(--error-fondo);
      color:var(--error-texto);
    }

    .mensaje.exito {
      display:block;
      background:var(--exito-fondo);
      color:var(--exito-texto);
    }

    .mensaje.info {
      display:block;
      background:var(--info-fondo);
      color:var(--info-texto);
    }

    .cierre {
      background:var(--info-fondo);
      color:var(--info-texto);
      border:1px solid #cbdde1;
      border-radius:10px;
      padding:14px;
      margin-bottom:16px;
      line-height:1.45;
    }

    .oculto { display:none !important; }

    @media (max-width:850px) {
      .talleres {
        grid-template-columns:repeat(2,minmax(0,1fr));
      }
    }

    @media (max-width:600px) {
      .contenedor {
        width:min(100% - 20px,1120px);
        margin:18px auto 32px;
      }

      .encabezado h1 { font-size:26px; }
      .encabezado p { font-size:16px; }
      .tarjeta { padding:16px; border-radius:13px; }
      .ponente-info { grid-template-columns:1fr; }
      .talleres { grid-template-columns:1fr; }

      .fila {
        align-items:stretch;
      }

      .fila > div:first-child {
        width:100%;
      }

      .fila button,
      .acciones button {
        width:auto;
      }
    }
  </style>
</head>
<body>
  <main class="contenedor">
    <header class="encabezado">
      <h1>SOMECE 2026</h1>
      <p>Inscripción a Talleres</p>
    </header>

    <section class="tarjeta" id="pasoValidacion">
      <h2>Validar Pedimento</h2>

      <div class="fila">
        <div>
          <label for="pedimento">Número de Pedimento</label>
          <input
            id="pedimento"
            type="text"
            placeholder="Ingrese su Pedimento"
            autocomplete="off"
          >
        </div>

        <button
          id="btnValidar"
          class="principal"
          type="button"
          onclick="validarPedimentoExterno()"
        >
          Validar
        </button>
      </div>

      <div id="mensajeValidacion" class="mensaje"></div>
    </section>

    <section id="seccionTalleres" class="tarjeta oculto">
      <h2>Selección de Talleres</h2>

      <div id="ponenteInfo" class="ponente-info"></div>

      <div id="avisoCierre" class="cierre oculto"></div>

      <div class="barra-seleccion">
        <div id="textoMaximo"></div>
        <div id="contador" class="contador"></div>
      </div>

      <div id="listaTalleres" class="talleres"></div>

      <div class="acciones">
        <button
          id="btnGuardar"
          class="principal"
          type="button"
          onclick="guardarInscripcion()"
        >
          Guardar inscripción
        </button>

        <button
          class="secundario"
          type="button"
          onclick="reiniciar()"
        >
          Cambiar Pedimento
        </button>
      </div>

      <div id="mensajeGuardado" class="mensaje"></div>
    </section>
  </main>

  <script>
    const URL_WEB_APP = 'https://script.google.com/a/macros/somece.org.mx/s/AKfycbzdBvqNmIBe6XMsKq3OfWwTGQQUruiNJbAr-8-9QI1XutTRrkCzFhvvAWAa55-OQmsrDA/exec';

    let idPonenteActual = '';
    let talleresActuales = [];
    let talleresSeleccionados = [];
    let maxTalleres = 1;
    let cupoTalleres = 0;
    let inscripcionAbierta = true;
    let fechaLimiteInscripcion = '';

    function escapar(valor) {
      const div = document.createElement('div');
      div.textContent = valor == null ? '' : String(valor);
      return div.innerHTML;
    }

    function mostrarMensaje(id, texto, tipo) {
      const elemento = document.getElementById(id);
      elemento.textContent = texto || '';
      elemento.className = 'mensaje ' + tipo;
    }

    function ocultarMensaje(id) {
      const elemento = document.getElementById(id);
      elemento.textContent = '';
      elemento.className = 'mensaje';
    }

    function jsonp(parametros, callback, errorCallback) {
      const nombre =
        'jsonpSomece_' +
        Date.now() + '_' +
        Math.floor(Math.random() * 100000);

      const script = document.createElement('script');
      let terminado = false;

      window[nombre] = function(respuesta) {
        if (terminado) return;
        terminado = true;
        clearTimeout(temporizador);
        delete window[nombre];
        if (script.parentNode) script.parentNode.removeChild(script);
        callback(respuesta);
      };

      const pares = Object.keys(parametros).map(function(clave) {
        return encodeURIComponent(clave) + '=' +
          encodeURIComponent(parametros[clave]);
      });

      script.src =
        URL_WEB_APP + '?' +
        pares.join('&') +
        '&callback=' +
        encodeURIComponent(nombre) +
        '&_=' + Date.now();

      script.onerror = function() {
        if (terminado) return;
        terminado = true;
        clearTimeout(temporizador);
        delete window[nombre];
        if (script.parentNode) script.parentNode.removeChild(script);
        errorCallback('No fue posible conectar con SOMECE.');
      };

      const temporizador = setTimeout(function() {
        if (terminado) return;
        terminado = true;
        // Mantener un callback inocuo: Apps Script puede responder
        // después del tiempo de espera. Evita ReferenceError tardío.
        window[nombre] = function() {};
        if (script.parentNode) script.parentNode.removeChild(script);
        errorCallback('El servidor tardó demasiado en responder.');
      }, 30000);

      document.body.appendChild(script);
    }

    function validarPedimentoExterno() {
      const pedimento =
        document.getElementById('pedimento').value.trim();

      ocultarMensaje('mensajeValidacion');
      ocultarMensaje('mensajeGuardado');

      if (!pedimento) {
        mostrarMensaje(
          'mensajeValidacion',
          'Ingrese su Pedimento.',
          'error'
        );
        return;
      }

      const boton = document.getElementById('btnValidar');
      boton.disabled = true;
      boton.textContent = 'Validando...';

      jsonp(
        {
          pagina:'validarPedimentoInscripcionTalleresExterna',
          pedimento:pedimento
        },
        function(resultado) {
          boton.disabled = false;
          boton.textContent = 'Validar';

          if (
            !resultado ||
            !resultado.ok ||
            !resultado.encontrado
          ) {
            mostrarMensaje(
              'mensajeValidacion',
              (resultado && resultado.mensaje) ||
                'No se encontró el Pedimento.',
              'error'
            );
            return;
          }

          idPonenteActual =
            String(resultado.idPonente || '');

          talleresActuales =
            Array.isArray(resultado.talleres)
              ? resultado.talleres
              : [];

          talleresSeleccionados =
            Array.isArray(resultado.seleccionados)
              ? resultado.seleccionados.map(String)
              : [];

          const maximo =
            Number(resultado.maxTalleres);

          maxTalleres =
            Number.isFinite(maximo) && maximo >= 1
              ? Math.floor(maximo)
              : 1;

          cupoTalleres =
            Number(resultado.cupoTalleres || 0);

          inscripcionAbierta =
            resultado.inscripcionAbierta !== false;

          fechaLimiteInscripcion =
            String(
              resultado.fechaLimiteInscripcion || ''
            );

          mostrarPonente(resultado);
          mostrarEstadoCierre(resultado);
          renderTalleres();

          document
            .getElementById('seccionTalleres')
            .classList.remove('oculto');
        },
        function(mensaje) {
          boton.disabled = false;
          boton.textContent = 'Validar';
          mostrarMensaje(
            'mensajeValidacion',
            mensaje,
            'error'
          );
        }
      );
    }

    function mostrarPonente(resultado) {
      document.getElementById('ponenteInfo').innerHTML =
        '<div class="dato"><strong>Ponente</strong>' +
        escapar(resultado.NomPonente) +
        '</div>' +
        '<div class="dato"><strong>Pedimento</strong>' +
        escapar(resultado.pedimento) +
        '</div>';
    }

    function mostrarEstadoCierre(resultado) {
      const aviso = document.getElementById('avisoCierre');

      if (!inscripcionAbierta) {
        aviso.textContent =
          resultado.mensajeCierre ||
          'El periodo de inscripción ha finalizado.';
        aviso.classList.remove('oculto');
      } else {
        aviso.textContent = '';
        aviso.classList.add('oculto');
      }
    }

    function renderTalleres() {
      const contenedor =
        document.getElementById('listaTalleres');

      contenedor.innerHTML = '';

      document.getElementById('textoMaximo').textContent =
        inscripcionAbierta
          ? 'Puede seleccionar hasta ' +
            maxTalleres +
            (maxTalleres === 1 ? ' Taller.' : ' Talleres.')
          : 'Inscripción cerrada · modo consulta';

      document.getElementById('contador').textContent =
        'Seleccionados: ' +
        talleresSeleccionados.length +
        ' de ' +
        maxTalleres;

      if (!talleresActuales.length) {
        contenedor.innerHTML =
          '<div class="mensaje info" style="display:block;">' +
          'No hay Talleres disponibles.' +
          '</div>';
        document.getElementById('btnGuardar').disabled = true;
        return;
      }

      talleresActuales.forEach(function(taller) {
        const id = String(taller.idTaller || '');
        const seleccionado =
          talleresSeleccionados.includes(id);

        const tarjeta =
          document.createElement('div');

        tarjeta.className =
          'taller' +
          (seleccionado ? ' seleccionado' : '') +
          (!inscripcionAbierta ? ' bloqueado' : '');

        const checkbox =
          document.createElement('input');

        const cupoCompleto =
          taller.cupoCompleto === true ||
          Number(taller.disponibles || 0) <= 0;

        checkbox.type = 'checkbox';
        checkbox.checked = seleccionado;
        checkbox.disabled =
          !inscripcionAbierta ||
          (cupoCompleto && !seleccionado);
        checkbox.setAttribute(
          'aria-label',
          'Seleccionar ' + (taller.NomTaller || 'Taller')
        );

        checkbox.addEventListener('click', function(event) {
          event.stopPropagation();
        });

        checkbox.addEventListener('change', function() {
          cambiarSeleccion(id);
        });

        const nombre =
          document.createElement('span');

        nombre.className = 'taller-nombre';
        nombre.textContent =
          taller.NomTaller || 'Taller';

        tarjeta.appendChild(checkbox);
        tarjeta.appendChild(nombre);

        [
          ['Tallerista', taller.NomPonente || taller.Tallerista || ''],
          ['Fecha', taller.Fecha || ''],
          ['Hora', taller.Hora || ''],
          ['Modalidad', taller.Modalidad || ''],
          [
            'Cupo',
            String(Number(taller.cupoTaller || 0)) +
            ' · Inscritos: ' +
            String(Number(taller.inscritos || 0)) +
            ' · Disponibles: ' +
            String(Number(taller.disponibles || 0)) +
            (
              Number(taller.disponibles || 0) <= 0
                ? ' · Cupo completo'
                : ''
            )
          ]
        ].forEach(function(par) {
          if (!par[1]) return;

          const dato =
            document.createElement('div');

          dato.className = 'taller-dato';
          dato.textContent =
            par[0] + ': ' + par[1];

          tarjeta.appendChild(dato);
        });

        if (
          inscripcionAbierta &&
          (!cupoCompleto || seleccionado)
        ) {
          tarjeta.addEventListener('click', function() {
            cambiarSeleccion(id);
          });
        }

        contenedor.appendChild(tarjeta);
      });

      document.getElementById('btnGuardar').disabled =
        !inscripcionAbierta;
    }

    function cambiarSeleccion(idTaller) {
      if (!inscripcionAbierta) return;

      idTaller = String(idTaller);

      const indice =
        talleresSeleccionados.indexOf(idTaller);

      if (indice >= 0) {
        talleresSeleccionados.splice(indice, 1);
      } else {
        const taller =
          talleresActuales.find(
            item => String(item.idTaller || '') === idTaller
          );

        if (
          taller &&
          (
            taller.cupoCompleto === true ||
            Number(taller.disponibles || 0) <= 0
          )
        ) {
          mostrarMensaje(
            'mensajeGuardado',
            'Este Taller ya no tiene lugares disponibles.',
            'error'
          );
          renderTalleres();
          return;
        }

        if (
          talleresSeleccionados.length >= maxTalleres
        ) {
          mostrarMensaje(
            'mensajeGuardado',
            'Sólo puede seleccionar máximo ' +
              maxTalleres +
              (maxTalleres === 1 ? ' Taller.' : ' Talleres.'),
            'error'
          );
          renderTalleres();
          return;
        }

        talleresSeleccionados.push(idTaller);
      }

      ocultarMensaje('mensajeGuardado');
      renderTalleres();
    }

    function guardarInscripcion() {
      if (!idPonenteActual) {
        mostrarMensaje(
          'mensajeGuardado',
          'Primero valide su Pedimento.',
          'error'
        );
        return;
      }

      if (!inscripcionAbierta) {
        mostrarMensaje(
          'mensajeGuardado',
          'El periodo de inscripción ha finalizado. Sólo puede consultar sus Talleres.',
          'error'
        );
        return;
      }

      if (
        talleresSeleccionados.length > maxTalleres
      ) {
        mostrarMensaje(
          'mensajeGuardado',
          'Sólo puede seleccionar máximo ' +
            maxTalleres +
            ' Talleres.',
          'error'
        );
        return;
      }

      const boton =
        document.getElementById('btnGuardar');

      boton.disabled = true;
      boton.textContent = 'Guardando...';

      jsonp(
        {
          pagina:'guardarInscripcionTalleresExterna',
          idPonente:idPonenteActual,
          talleres:JSON.stringify(talleresSeleccionados)
        },
        function(resultado) {
          boton.textContent = 'Guardar inscripción';

          if (!resultado || !resultado.ok) {
            boton.disabled = !inscripcionAbierta;
            mostrarMensaje(
              'mensajeGuardado',
              (resultado && resultado.mensaje) ||
                'No fue posible guardar la inscripción.',
              'error'
            );

            if (resultado && resultado.cerrado) {
              inscripcionAbierta = false;
              renderTalleres();
            }
            return;
          }

          boton.disabled = false;
          mostrarMensaje(
            'mensajeGuardado',
            resultado.mensaje ||
              'La inscripción a Talleres se guardó correctamente.',
            'exito'
          );

          // Refrescar cupos y lugares disponibles desde el servidor
          // después de confirmar el guardado.
          const pedimentoActual =
            document.getElementById('pedimento').value.trim();

          if (pedimentoActual) {
            jsonp(
              {
                pagina:'validarPedimentoInscripcionTalleresExterna',
                pedimento:pedimentoActual,
                _refresco:Date.now()
              },
              function(refresco) {
                if (refresco && refresco.ok && refresco.encontrado) {
                  idPonenteActual =
                    String(refresco.idPonente || idPonenteActual);

                  maxTalleres =
                    Number(refresco.maxTalleres || maxTalleres || 1);

                  inscripcionAbierta =
                    refresco.inscripcionAbierta !== false;

                  fechaLimiteInscripcion =
                    refresco.fechaLimiteInscripcion || '';

                  talleresActuales =
                    Array.isArray(refresco.talleres)
                      ? refresco.talleres
                      : talleresActuales;

                  talleresSeleccionados =
                    Array.isArray(refresco.talleresInscritos)
                      ? refresco.talleresInscritos.map(String)
                      : talleresSeleccionados;

                  renderTalleres();
                }
              },
              function() {
                // El guardado ya fue confirmado. Si falla sólo este
                // refresco, se conserva el mensaje de éxito.
              }
            );
          }
        },
        function(mensaje) {
          boton.disabled = false;
          boton.textContent = 'Guardar inscripción';
          mostrarMensaje(
            'mensajeGuardado',
            mensaje,
            'error'
          );
        }
      );
    }

    function reiniciar() {
      idPonenteActual = '';
      talleresActuales = [];
      talleresSeleccionados = [];
      maxTalleres = 1;
      inscripcionAbierta = true;
      fechaLimiteInscripcion = '';

      document.getElementById('pedimento').value = '';
      document
        .getElementById('seccionTalleres')
        .classList.add('oculto');

      ocultarMensaje('mensajeValidacion');
      ocultarMensaje('mensajeGuardado');
      document.getElementById('pedimento').focus();
    }

    document
      .getElementById('pedimento')
      .addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
          event.preventDefault();
          validarPedimentoExterno();
        }
      });
  </script>
</body>
</html>
